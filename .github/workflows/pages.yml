# Veröffentlicht nur die App-Dateien (ohne Tests und Werkzeuge) auf GitHub Pages.
# Einmalig nötig: Settings, Pages, Source = "GitHub Actions". Danach läuft jeder Push auf main automatisch.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test (Node, ohne Abhängigkeiten)
        run: npm test
      - name: App-Dateien zusammenstellen
        run: |
          mkdir _site
          cp -r index.html styles.css manifest.webmanifest sw.js src icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
